name: Fuzz

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly long fuzz run.
    - cron: "0 3 * * 0"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Build
        run: go build ./...

      - name: Fuzz appendJSONString
        run: go test -run='^$' -fuzz=FuzzAppendJSONString -fuzztime=30s .

      - name: Fuzz appendDuration
        run: go test -run='^$' -fuzz=FuzzAppendDuration -fuzztime=30s .

      - name: Fuzz rate limit window
        run: go test -run='^$' -fuzz=FuzzRateLimitWindow -fuzztime=30s .

  fuzz-long:
    name: Fuzz long ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzAppendJSONString
          - FuzzAppendDuration
          - FuzzRateLimitWindow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: Build
        run: go build ./...

      - name: Run long fuzz target
        run: go test -run='^$' -fuzz=${{ matrix.target }} -fuzztime=60m .