name: compat

# Tests on Linux, macOS and Windows with the minimum and the latest Go version.
# Windows has had little real-world use: a failure there is a finding to look
# at, not necessarily a regression.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.21", "stable"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false # the module has no dependencies, so there is no go.sum to key the cache on

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test (race detector)
        # The race detector needs cgo on Windows; skip it there.
        if: ${{ matrix.os != 'windows-latest' }}
        run: go test -race -count=1 ./...
